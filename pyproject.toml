[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "aiar"
version = "0.1.0"
description = "Artificial Intelligence and RAG — a model-agnostic (any Qwen via Ollama) RAG + grounding + evaluation + watcher-GUI + prompt-harness framework."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "AIAR contributors" }]
keywords = ["rag", "ollama", "qwen", "evaluation", "grounding", "reranker", "llm"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
urls = { Repository = "https://github.com/wiggins-j/aiar", License = "https://github.com/wiggins-j/aiar/blob/main/LICENSE" }
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
rag = ["chromadb>=0.5.0", "sentence-transformers>=3.0.0", "rank-bm25>=0.2.2", "pypdf>=5.0.0"]
service = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.0"]
dev = ["pytest>=7.0"]

[project.scripts]
aiar-ingest = "aiar.rag.ingest:main"
aiar-harness = "aiar.harness.__main__:main"
aiar-eval = "aiar.eval.runner:main"
aiar-doctor = "aiar.doctor:main"

[tool.setuptools.packages.find]
include = ["aiar*", "web*"]

[tool.setuptools]
license-files = ["LICENSE", "NOTICE"]

[tool.setuptools.package-data]
web = ["static/*"]
