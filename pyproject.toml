[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "aiar"
version = "0.1.0"
description = "Artificial Intelligence and RAG — a model-agnostic (any Qwen via Ollama) RAG + grounding + evaluation + watcher-GUI + prompt-harness framework."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "AIAR contributors" }]
keywords = ["rag", "ollama", "qwen", "evaluation", "grounding", "reranker", "llm"]
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
rag = ["chromadb>=0.5.0", "sentence-transformers>=3.0.0", "rank-bm25>=0.2.2"]
service = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.0"]
dev = ["pytest>=7.0"]

[project.scripts]
aiar-ingest = "aiar.rag.ingest:main"
aiar-harness = "aiar.harness.__main__:main"
aiar-eval = "aiar.eval.runner:main"

[tool.setuptools.packages.find]
include = ["aiar*", "web*"]

[tool.setuptools.package-data]
web = ["static/*"]
