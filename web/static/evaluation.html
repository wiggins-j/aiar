<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AIAR — Evaluation queue</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <nav class="page-nav" aria-label="Primary">
          <a class="nav-pill" href="/">Simulate</a>
          <a class="nav-pill" href="/activity">Activity</a>
          <span class="nav-pill nav-pill-active">Evaluation queue</span>
          <a class="nav-pill" href="/settings">Settings</a>
        </nav>
        <div class="hero-brand">
          <img class="hero-logo" src="/aiar-logo.png" alt="AIAR logo" />
          <div>
            <h1>Evaluation queue</h1>
            <p class="tagline">Score each marked answer 1-10. A low score requires a correction — submitting it <strong>regrounds</strong> the prompt so the next answer improves.</p>
          </div>
        </div>
      </header>

      <section class="panel">
        <div class="section-heading section-heading-row">
          <div>
            <h2>Pending reviews</h2>
            <p id="queue-label" class="muted">Loading...</p>
          </div>
          <div class="toolbar-row">
            <button id="clear-queue" class="secondary">Clear queue</button>
            <span id="clear-queue-message" class="muted"></span>
          </div>
        </div>
        <div id="queue"></div>
      </section>

      <footer class="site-footer">
        <p>Licensed under the Apache License 2.0. See <a href="/LICENSE">LICENSE</a> and <a href="/NOTICE">NOTICE</a>.</p>
      </footer>
    </main>
    <script src="/evaluation.js"></script>
  </body>
</html>
